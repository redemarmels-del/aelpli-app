<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Älpli Bestellung</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8a1f24"><style>
:root{font-family:system-ui,sans-serif;color:#211b16}*{box-sizing:border-box}body{margin:0;background:#f3efe5}.top{position:sticky;top:0;z-index:4;background:#8a1f24;color:white;padding:14px 16px;border-bottom:4px solid #d6a62d}.top h1{margin:0;font-size:22px}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.btn{border:0;border-radius:11px;padding:11px 13px;background:#8a1f24;color:#fff;font-weight:700}.secondary{background:#6f685f}.danger{background:#b4262b}input{width:92px;padding:11px;border:1px solid #bbb;border-radius:10px;font-size:16px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0;padding-bottom:2px}.tab{white-space:nowrap;background:#efe2b8;color:#4b2f18}.tab.active{background:#8a1f24;color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:8px}.prod{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid #e0d5c4;border-radius:12px}.prodText{min-width:0}.prod b{display:block}.prod small{display:block;color:#666;margin-top:2px}.priceEdit{margin-top:5px;padding:5px 8px;border:0;border-radius:8px;background:#efe2b8;color:#4b2f18;font-weight:700}.order{border-top:1px solid #eee;padding:9px 0;overflow:hidden}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;flex-wrap:nowrap}.itemline{display:flex;flex-flow:row nowrap;align-items:center;width:100%;gap:4px;padding:5px 0;overflow:hidden}.itemname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.qbtn{flex:0 0 31px;width:31px;height:31px;border:0;border-radius:8px;font-size:18px;padding:0}.qnum{flex:0 0 16px;text-align:center;font-weight:700}.price{flex:0 0 68px;white-space:nowrap;text-align:right;font-size:13px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}

/* Mobile hardening: iPhone + Android */
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
.top{padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
.wrap{padding:10px max(8px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.btn{min-height:44px}
.qbtn{flex-basis:36px;width:36px;height:36px}
@media(max-width:699px){.grid{grid-template-columns:1fr}.prod{min-height:58px}}
@media(max-width:420px){.card{padding:9px}.itemline{gap:3px}.itemname{font-size:12px}.price{flex-basis:64px;font-size:12px}.actions{grid-template-columns:1fr}.top h1{font-size:20px}}
</style></head><body><header class="top"><h1>🏔️ Älpli Bestellaufnahme</h1></header><main class="wrap"><section class="card"><b>Tisch Nr.</b> <input id="tableNo" inputmode="numeric" placeholder="z.B. 11"> <button class="btn" onclick="startTable()">Tisch starten</button><div id="openTables" class="tabs"></div></section><div id="app"></div></main><script>
const groups={
"Rotwein":[["Malanser Blauburgunder 12 Monate im Holzfass gereift - Wegelin 7.5 dl",46],["Älplwy, Malanser Pinot Noir Sélection - von Salis 5 dl",24],["Malanser Blauburgunder (Bio) - Louis Liesch 5 dl",21],["Malanser Blauburgunder - Boner & Rasi 5 dl",21],["Malanser Blauburgunder - von Salis 2 dl",10],["Primitivo Puglia 5 dl",22]],
"Federweiss":[["Malanser Federweiss - Boner & Rasi 5 dl",22]],
"Weisswein":[["Malanser Weissburgunder - Wegelin 7.5 dl",46],["Riesling x Silvaner - Lauber 5 dl",22],["Riesling x Silvaner - von Salis 2 dl",10],["Féchy 2 dl",8.5],["Féchy 5 dl",20],["Prosecco 2 dl",12]],
"Bier / Most":[["Radler 3 dl",4.5],["Edelbräu 3 dl",4.5],["Calanda Lager 5.8 dl",5.5],["Most trüb, mit und ohne Alkohol - Möhl 5 dl",5.5]],
"Diverses":[["Älplikafi",8],["Zwätschgeluz",7],["Marc (Malanser) Boner & Rasi 2.5 cl",5.5],["Brandy (Vecchia Romagna) 2.5 cl",5],["Zwätschge 4 cl",5.5]],
"Alkoholfrei":[["Passugger Mineralwasser 5 dl",4.5],["Passugger Mineralwasser 10 dl",8],["Allegra stilles Wasser 5 dl",4.5],["Coca Cola / Cola Zero 5 dl",4.5],["Rivella rot / Rivella blau 5 dl",4.5],["Elmer Citro 5 dl",4.5],["Shorley 5 dl",4.5],["Eistee 5 dl",4.5],["Orangensaft Michel 3.3 dl",5]],
"Warme Getränke":[["Kaffee / Espresso / Milchkaffee / Cappuccino",4],["Schwarztee / Pfefferminztee / Früchtetee / Verbena",4],["Ovomaltine",4],["Chocolat",4]],
"Speisen":[["Tagesmenü",null],["Salsiz mit Brot",10],["Käse Portion",10],["Rohessspeck",10],["Birabrot mit Käse",10],["Bündner Gerstensuppe",8.5],["Nussgipfel",3.5],["Diverses Gebäck",null]]};
let db=JSON.parse(localStorage.getItem('aelpliPwa')||'{}'),current=null,group='Speisen',activeOrder=0,sessionPrices=JSON.parse(sessionStorage.getItem('aelpliSessionPrices')||'{}');
function money(v){return 'CHF '+Number(v).toFixed(2)}function save(){localStorage.setItem('aelpliPwa',JSON.stringify(db));render()}function startTable(){let n=tableNo.value.trim();if(!n)return;db[n]??={orders:[[]]};current=n;activeOrder=0;save()}
function manualPrice(name){if(sessionPrices[name]!=null)return Number(sessionPrices[name]);let v=prompt('Preis für '+name+' in CHF eingeben:');if(v===null)return null;v=Number(String(v).replace(',','.'));if(!Number.isFinite(v)||v<0){alert('Bitte gültigen Preis eingeben.');return null}sessionPrices[name]=v;sessionStorage.setItem('aelpliSessionPrices',JSON.stringify(sessionPrices));render();return v}function editPrice(name){let v=prompt('Preis für '+name+' in CHF festlegen:',sessionPrices[name]??'');if(v===null)return;v=Number(String(v).replace(',','.'));if(!Number.isFinite(v)||v<0)return alert('Bitte gültigen Preis eingeben.');sessionPrices[name]=v;sessionStorage.setItem('aelpliSessionPrices',JSON.stringify(sessionPrices));render()}
function add(name,price){if(!current)return alert('Bitte zuerst Tisch starten.');if(price===null){price=manualPrice(name);if(price===null)return}let o=db[current].orders[activeOrder]||db[current].orders[0],l=o.find(x=>x.name===name&&x.price===price);l?l.qty++:o.push({name,price,qty:1});save()}function ch(oi,li,d){let l=db[current].orders[oi][li];l.qty+=d;if(l.qty<=0)db[current].orders[oi].splice(li,1);save()}function newOrder(){db[current].orders.push([]);activeOrder=db[current].orders.length-1;save()}function delOrder(i){db[current].orders.splice(i,1);if(!db[current].orders.length)db[current].orders=[[]];activeOrder=Math.min(activeOrder,db[current].orders.length-1);save()}function total(t){return db[t].orders.flat().reduce((s,x)=>s+x.price*x.qty,0)}function splitBill(){if(!current)return;let a=db[current].orders.map((o,i)=>({i,v:o.reduce((s,x)=>s+x.price*x.qty,0)})).filter(x=>x.v>0);alert('Rechnung Tisch '+current+'\n\n'+a.map(x=>'Bestellung / Person '+(x.i+1)+': '+money(x.v)).join('\n')+'\n\nGesamt: '+money(total(current)))}function closeTable(){if(!current)return;let t=current;if(!confirm('Tisch '+t+' wirklich abschliessen?'))return;if(!confirm('ACHTUNG: Alle Bestellungen von Tisch '+t+' werden gelöscht. Wirklich endgültig schliessen?'))return;delete db[t];current=null;save()}
function render(){openTables.innerHTML=Object.keys(db).map(t=>`<button class="btn tab ${t===current?'active':''}" onclick="current='${t}';activeOrder=0;render()">Tisch ${t} · ${money(total(t))}</button>`).join('');if(!current||!db[current]){app.innerHTML='<section class="card">Tisch auswählen oder neu starten.</section>';return}let tabs=Object.keys(groups).map(g=>`<button class="btn tab ${g===group?'active':''}" onclick="group='${g}';render()">${g}</button>`).join('');let prods=groups[group].map(([n,p])=>{let man=p===null,shown=man?(sessionPrices[n]!=null?money(sessionPrices[n]):'Preis eingeben'):money(p);return `<div class="prod"><div class="prodText"><b>${n}</b><small>${shown}</small>${man?`<button class="priceEdit" onclick='editPrice(${JSON.stringify(n)})'>Preis ändern</button>`:''}</div><button class="btn" onclick='add(${JSON.stringify(n)},${man?'null':p})'>+</button></div>`}).join('');let orders=db[current].orders.map((o,oi)=>`<div class="order"><div class="line"><button class="btn ${oi===activeOrder?'':'secondary'}" onclick="activeOrder=${oi};render()">${oi===activeOrder?'✓ ':''}Bestellung ${oi+1}</button><button class="btn danger" onclick="delOrder(${oi})">Löschen</button></div>${o.map((l,li)=>`<div class="itemline"><span class="itemname">${l.name}</span><button class="qbtn" onclick="ch(${oi},${li},-1)">−</button><span class="qnum">${l.qty}</span><button class="qbtn" onclick="ch(${oi},${li},1)">+</button><span class="price">${money(l.price*l.qty)}</span></div>`).join('')}</div>`).join('');app.innerHTML=`<section class="tabs">${tabs}</section><section class="card"><div class="grid">${prods}</div></section><section class="card"><h2>Tisch ${current}</h2>${orders}<button class="btn" onclick="newOrder()">+ Bestellung / Person</button><hr><div class="total"><span>Tisch Total</span><span>${money(total(current))}</span></div><div class="actions"><button class="btn secondary" onclick="splitBill()">Rechnung aufteilen</button><button class="btn danger" onclick="closeTable()">Tisch abschliessen</button></div></section>`}render();
</script>
<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("./service-worker.js")

.then(() => console.log("Service Worker aktiv"))

.catch(error => console.log("Service Worker Fehler:", error));

});

}

</script>
</body></html>
